name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contract
        run: npm run lint

      - name: Start Prism mock server
        run: |
          nohup npm run mock:core > prism.log 2>&1 &
          npx wait-on http://localhost:4010/health --timeout 30000

      - name: Run Newman contract tests
        run: npm run test:mock

      - name: Build HTML report
        if: always()
        run: npm run test:html || true

      - name: Show Prism log on failure
        if: failure()
        run: cat prism.log || true

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/
