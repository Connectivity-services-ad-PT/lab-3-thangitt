openapi: 3.1.0
info:
  title: Smart Campus — Lab 02 API Contract (Parking vs Core Business)
  version: 1.0.0
  description: |
    Contract-first OpenAPI 3.1.0 for Lab 02.
  contact:
    name: FIT4110 Team 02
    email: student.project@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://parking-api.campus.local
    description: Staging

tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: alerts
    description: Quản lý cảnh báo Smart Campus (Parking)
  - name: events
    description: Quản lý sự kiện nghiệp vụ

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service còn hoạt động.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: parking-integration-service
                    time: '2026-05-19T15:00:00Z'

  /alerts:
    post:
      operationId: createAlert
      summary: Tạo cảnh báo mới
      description: Parking System gửi yêu cầu tạo cảnh báo về trung tâm điều hành.
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
            examples:
              tailgatingDetected:
                value:
                  sourceService: parking-gate-subsystem
                  alertType: TAILGATING_DETECTED
                  severity: HIGH
                  message: Phát hiện bám đuôi xe (2 xe vượt 1 lần quẹt thẻ) tại cổng Barie hầm xe B1.
                  relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
      responses:
        '201':
          description: Cảnh báo đã được ghi nhận
          headers:
            Location:
              description: URI của alert vừa tạo.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
              examples:
                created:
                  value:
                    id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    sourceService: parking-gate-subsystem
                    alertType: TAILGATING_DETECTED
                    severity: HIGH
                    message: Phát hiện bám đuôi xe (2 xe vượt 1 lần quẹt thẻ) tại cổng Barie hầm xe B1.
                    relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    status: OPEN
                    createdAt: '2026-05-19T15:01:00Z'
                    resolvedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listAlerts
      summary: Lấy danh sách cảnh báo
      description: Lấy danh sách cảnh báo với cursor-based pagination.
      tags: [alerts]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách cảnh báo hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        sourceService: parking-gate-subsystem
                        alertType: TAILGATING_DETECTED
                        severity: HIGH
                        message: Phát hiện bám đuôi xe (2 xe vượt 1 lần quẹt thẻ) tại cổng Barie hầm xe B1.
                        relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        status: OPEN
                        createdAt: '2026-05-19T15:01:00Z'
                        resolvedAt: null
                    nextCursor: null
                    hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alerts/recent:
    get:
      operationId: getRecentAlerts
      summary: Lấy cảnh báo gần đây
      description: Endpoint lấy nhanh cảnh báo chưa xử lý cho Dashboard giám sát.
      tags: [alerts]
      parameters:
        - name: limit
          in: query
          required: false
          description: Số lượng cảnh báo tối đa.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách cảnh báo gần đây
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
              examples:
                recentAlerts:
                  value:
                    items: []
                    nextCursor: null
                    hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alerts/{alertId}:
    get:
      operationId: getAlertById
      summary: Lấy chi tiết cảnh báo
      description: Lấy chi tiết alert theo UUID.
      tags: [alerts]
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Chi tiết thông tin cảnh báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events:
    post:
      operationId: createCampusEvent
      summary: Gửi sự kiện nghiệp vụ
      description: Nhận dữ liệu từ các thiết bị ngoài trời.
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusEvent'
            examples:
              sensorEvent:
                value:
                  eventType: SENSOR_READING
                  eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                  deviceId: SENSOR-102
                  metric: parking_occupancy
                  value: 85.0
                  unit: percent
                  timestamp: '2026-05-19T15:00:00Z'
              accessEvent:
                value:
                  eventType: ACCESS_CHECK
                  eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                  gateId: PKG-GATE-02
                  cardId: RFID-2026-999
                  decision: ALLOW
                  timestamp: '2026-05-19T15:02:00Z'
      responses:
        '201':
          description: Sự kiện đã được lưu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AlertId:
      name: alertId
      in: path
      required: true
      description: UUID của cảnh báo bãi xe.
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: Token mã hóa chuỗi phân trang.
      schema:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'

    Limit:
      name: limit
      in: query
      required: false
      description: Số lượng bản ghi tối đa.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
          description: Trạng thái tổng thể.
          example: ok
        service:
          type: string
          minLength: 2
          maxLength: 80
          description: Tên dịch vụ.
          example: parking-integration-service
        time:
          type: string
          format: date-time
          description: Thời gian máy chủ hiển thị.
          example: '2026-05-19T15:00:00Z'

    AlertSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
      description: Mức độ khẩn cấp.
      example: HIGH

    CreateAlertRequest:
      type: object
      additionalProperties: false
      required: [sourceService, alertType, severity, message]
      properties:
        sourceService:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Định danh phân hệ báo lỗi.
          example: parking-gate-subsystem
        alertType:
          type: string
          enum: [UNAUTHORIZED_ACCESS, SENSOR_THRESHOLD_EXCEEDED, SYSTEM_ERROR, PARKING_SESSION_TIMEOUT, TAILGATING_DETECTED]
          description: Danh mục phân loại sự cố bãi đỗ.
          example: TAILGATING_DETECTED
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message:
          type: string
          minLength: 5
          maxLength: 500
          description: Chi tiết tin nhắn cảnh báo.
          example: Phát hiện bám đuôi xe (2 xe vượt 1 lần quẹt thẻ) tại cổng Barie hầm xe B1.
        relatedEventId:
          description: Liên kết UUID sự kiện gốc nếu có.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

    Alert:
      type: object
      additionalProperties: false
      required: [id, sourceService, alertType, severity, message, status, createdAt, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
          description: ID duy nhất của cảnh báo.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
        sourceService:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Định danh phân hệ báo lỗi.
          example: parking-gate-subsystem
        alertType:
          type: string
          enum: [UNAUTHORIZED_ACCESS, SENSOR_THRESHOLD_EXCEEDED, SYSTEM_ERROR, PARKING_SESSION_TIMEOUT, TAILGATING_DETECTED]
          description: Danh mục phân loại sự cố.
          example: TAILGATING_DETECTED
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message:
          type: string
          minLength: 5
          maxLength: 500
          description: Chi tiết tin nhắn cảnh báo.
          example: Phát hiện bám đuôi xe (2 xe vượt 1 lần quẹt thẻ) tại cổng Barie hầm xe B1.
        relatedEventId:
          description: Liên kết UUID sự kiện gốc nếu có.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED, RESOLVED]
          description: Tiến trình xử lý.
          example: OPEN
        createdAt:
          type: string
          format: date-time
          description: Thời điểm ghi nhận vào DB.
          example: '2026-05-19T15:01:00Z'
        resolvedAt:
          description: Thời điểm đã xử lý, null nếu chưa giải quyết.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          example: null

    AlertPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Alert'
        nextCursor:
          description: Cursor cho trang kế tiếp.
          oneOf:
            - type: string
            - type: 'null'
          example: null
        hasMore:
          type: boolean
          description: Cờ cho biết còn trang tiếp theo hay không.
          example: false

    CampusEvent:
      oneOf:
        - $ref: '#/components/schemas/SensorEvent'
        - $ref: '#/components/schemas/AccessEvent'
      discriminator:
        propertyName: eventType
        mapping:
          SENSOR_READING: '#/components/schemas/SensorEvent'
          ACCESS_CHECK: '#/components/schemas/AccessEvent'

    SensorEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, deviceId, metric, value, unit, timestamp]
      properties:
        eventType:
          type: string
          const: SENSOR_READING
          description: Nhãn phân biệt loại sự kiện.
          example: SENSOR_READING
        eventId:
          type: string
          format: uuid
          description: ID sự kiện telemetry.
        deviceId:
          type: string
          pattern: '^SENSOR-[0-9]{3}$'
          example: SENSOR-102
        metric:
          type: string
          enum: [temperature, humidity, smoke, motion, parking_occupancy, carbon_monoxide]
          example: parking_occupancy
        value:
          type: number
          minimum: -100
          maximum: 1000
          example: 85.0
        unit:
          type: string
          minLength: 1
          maxLength: 20
          example: percent
        timestamp:
          type: string
          format: date-time

    AccessEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, gateId, cardId, decision, timestamp]
      properties:
        eventType:
          type: string
          const: ACCESS_CHECK
          example: ACCESS_CHECK
        eventId:
          type: string
          format: uuid
        gateId:
          type: string
          pattern: '^PKG-GATE-[0-9]{2}$'
          example: PKG-GATE-02
        cardId:
          type: string
          pattern: '^RFID-[0-9]{4}-[0-9]{3}$'
          example: RFID-2026-999
        decision:
          type: string
          enum: [ALLOW, DENY]
          example: ALLOW
        timestamp:
          type: string
          format: date-time

    EventAccepted:
      type: object
      additionalProperties: false
      required: [eventId, acceptedAt]
      properties:
        eventId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI loại lỗi theo RFC 7807.
          example: https://campus.local/errors/validation
        title:
          type: string
          minLength: 3
          maxLength: 120
          description: Tóm tắt ngắn lỗi.
          example: Dữ liệu không hợp lệ
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Mã trạng thái HTTP.
          example: 400
        detail:
          description: Mô tả chi tiết.
          oneOf:
            - type: string
              maxLength: 500
            - type: 'null'
          example: Vi phạm định dạng cardId
        instance:
          description: Request endpoint bị lỗi.
          oneOf:
            - type: string
              format: uri
            - type: 'null'
          example: https://api.campus.local/events
        errors:
          type: array
          minItems: 0
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 80
              code:
                type: string
                minLength: 2
                maxLength: 80
              message:
                type: string
                minLength: 3
                maxLength: 200

  responses:
    BadRequest:
      description: Lỗi định dạng JSON hoặc Schema không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token xác thực JWT hết hạn hoặc không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Phân quyền của Consumer không cho phép thực hiện.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tìm thấy thực thể.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Sự kiện trùng lặp ID (idempotency error) hoặc xung đột nghiệp vụ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Payload JSON đúng format nhưng vi phạm logic nghiệp vụ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Hệ thống gặp lỗi bất ngờ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

